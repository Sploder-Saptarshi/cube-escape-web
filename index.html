<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cube Escape Collection</title>
<link rel="icon" href="assets/favicon.png" type="image/png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  #container { width: 100%; height: 100%; }
  embed {
    display: block;
    width: 100%;
    height: 100%;
  }
  #overlay {
    position: fixed;
    inset: 0;
    background: #000;
    color: #fff;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #overlay.hidden { display: none; }
  #loading {
    font-size: 16px;
    height: 20px;
    line-height: 20px;
  }
  #stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 100%;
    height: 64px;
    transition: opacity 0.5s ease;
  }
  #stage.hidden {
    opacity: 0;
    visibility: hidden;
  }
  .track {
    width: 90%;
    max-width: 900px;
    height: 8px;
    background: #333;
    border-radius: 4px;
    overflow: hidden;
  }
  .bar {
    height: 100%;
    width: 0%;
    background: #fff;
    transition: width 0.1s linear;
  }
  #label { font-size: 13px; opacity: 0.8; height: 16px; line-height: 16px; }
</style>
<script>
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = {
    autoplay: "on",
    unmuteOverlay: "hidden",
    contextMenu: "off",
    showSwfDownload: false,
    forceScale: true,
    letterbox: "off",
    splashScreen: false,
    "backgroundColor": "#000000",
  };
</script>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
  <div id="overlay">
    <div id="loading">Loading...</div>
    <div id="stage">
      <div class="track"><div class="bar" id="bar"></div></div>
      <div id="label"></div>
    </div>
  </div>
  <div id="container"></div>
  <script>
    (function () {
      var bar = document.getElementById("bar");
      var label = document.getElementById("label");
      var stage = document.getElementById("stage");
      var overlay = document.getElementById("overlay");
      var total = 0;
      var loaded = 0;

      function fmt(bytes) {
        return (bytes / 1048576).toFixed(1) + " MB";
      }

      function update() {
        var pct = total > 0 ? loaded / total : 0;
        bar.style.width = (pct * 100).toFixed(1) + "%";
        label.textContent = fmt(loaded) + " / " + fmt(total);
      }

      // Stream one URL, counting bytes for the progress bar. Returns an
      // ArrayBuffer of the body (used for the split SWF parts).
      function download(url) {
        return fetch(url).then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status + " for " + url);
          var contentLength = res.headers.get("Content-Length");
          if (contentLength) total += parseInt(contentLength, 10);
          var reader = res.body.getReader();
          var chunks = [];
          var size = 0;
          function pump() {
            return reader.read().then(function (r) {
              if (r.done) {
                var buf = new Uint8Array(size);
                var off = 0;
                for (var i = 0; i < chunks.length; i++) {
                  buf.set(chunks[i], off);
                  off += chunks[i].length;
                }
                return buf.buffer;
              }
              chunks.push(r.value);
              size += r.value.byteLength;
              loaded += r.value.byteLength;
              update();
              return pump();
            });
          }
          return pump();
        });
      }

      function bootRuffle(data) {
        var ruffle = window.RufflePlayer.newest();
        var player = ruffle.createPlayer();
        player.style.width = "100%";
        player.style.height = "100%";
        document.getElementById("container").appendChild(player);
        return player.ruffle().load({
          data: data,
          swfFileName: "CubeEscapeCollection.swf"
        });
      }

      fetch("assets/manifest.json?t=" + Date.now())
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status + " for assets/manifest.json");
          return r.json();
        })
        .then(function (manifest) {
          var hash = manifest.hash;
          // Register a service worker that is versioned by the build hash, so
          // assets/sounds.swf is served from cache instead of hitting the
          // network again when the main SWF loads it. A new build -> new hash
          // -> fresh cache (stale ones are cleaned up on activate).
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js?hash=" + hash);
          }
          // Download and cache-warm all split chunks + sounds in parallel.
          var partPromises = manifest.parts.map(function (p) {
            return download("assets/" + p + "?v=" + hash);
          });
          var soundCache = "cube-escape-assets-" + hash;
          var soundsPath = "assets/sounds.swf";
          partPromises.push(download(soundsPath));
          return Promise.all(partPromises).then(function (results) {
            // Reassemble the SWF from its chunks.
            var parts = results.slice(0, -1);
            var data = parts[0];
            for (var i = 1; i < parts.length; i++) {
              var out = new Uint8Array(data.byteLength + parts[i].byteLength);
              out.set(new Uint8Array(data));
              out.set(new Uint8Array(parts[i]), data.byteLength);
              data = out.buffer;
            }
            // Store the already-downloaded sounds so the service worker can
            // serve it from cache when the main SWF loads it later.
            if ("caches" in window) {
              caches.open(soundCache).then(function (cache) {
                var res = new Response(new Uint8Array(results[results.length - 1]), {
                  headers: { "Content-Type": "application/x-shockwave-flash" }
                });
                cache.put(soundsPath, res);
              });
            }
            stage.classList.add("hidden");
            return bootRuffle(data).then(function () {
              window.setTimeout(function () { overlay.classList.add("hidden"); }, 900);
            });
          });
        })
        .catch(function (err) {
          label.textContent = "Failed to load assets: " + err.message;
        });
    })();
  </script>
</body>
</html>
